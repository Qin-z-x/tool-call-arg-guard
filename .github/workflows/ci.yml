name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core must be standard-library only
        run: python scripts/check_core_deps.py

      - name: Unit tests (unittest, no third-party dependencies)
        run: python -m unittest discover -s tests -t .

      - name: "CLI smoke test: dangerous calls produce high findings"
        run: |
          python -m toolarg_guard scan examples/dangerous_call.json --json > scan.json && python -c "import json; d=json.load(open('scan.json', encoding='utf-8')); assert d['summary']['high'] >= 4, d['summary']; print('findings:', d['summary'])"

      - name: "Clean calls pass the strictest gate"
        run: |
          python -m toolarg_guard scan examples/clean_call.json --fail-on low

      - name: "JSON-Schema validation catches the malformed call (expected exit 1)"
        run: |
          set +e
          python -m toolarg_guard scan examples/bad_schema_call.json --tools examples/tools.json --fail-on medium
          code=$?
          set -e
          echo "schema scan exit code: $code"
          test "$code" -eq 1

      - name: "CI gate catches the dangerous calls (expected exit code 1)"
        run: |
          set +e
          python -m toolarg_guard scan examples/dangerous_call.json --fail-on high
          code=$?
          set -e
          echo "scan exit code: $code"
          test "$code" -eq 1
